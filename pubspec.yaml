name: picture_perfect_v9
description: Interklima field documentation app with 3D height tracking and Google integration
publish_to: 'none'
version: 9.0.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  camera: ^0.10.6
  image: ^4.0.0
  permission_handler: ^11.4.0
  geolocator: ^10.1.1
  pdf: ^3.10.0
  printing: ^5.11.0
  path_provider: ^2.1.0
  path: ^1.9.1
  share_plus: ^7.0.0
  archive: ^3.4.0
  url_launcher: ^6.2.0
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/service_account.json
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
