name: picture_perfect
description: "Interklima field documentation app"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  permission_handler: ^12.0.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  path: ^1.9.0
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  archive: ^3.6.1
  mailer: ^6.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  http: ^1.2.0
  image: ^4.0.17
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
